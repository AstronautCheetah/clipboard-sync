# Tests on every push; a tag vX.Y.Z-ft.N also builds the aarch64 Linux binary Frame Tweaks installs
# (its Shared clipboard) and publishes it, with SHA256SUMS, as that tag's release. Built on
# Ubuntu 24.04 (glibc 2.39, as SteamOS has), linked to the system's libxcb as SteamOS has it.
name: Build
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write            # (the release, on a tag; a pull request's token is read-only anyway)
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      RUST_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build dependencies (libxcb, as SteamOS has it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev >/dev/null
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Release (a tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          name="clipboard-sync-${TAG#v}-aarch64-linux"
          mkdir -p "dist/$name"
          cp target/release/clipboard-sync README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS
          gh release create "$TAG" "dist/$name.tar.gz" dist/SHA256SUMS --title "$TAG" \
            --notes "Built from ${GITHUB_SHA::7} by this repository's Build workflow, for aarch64 Linux (glibc 2.39 or newer, libxcb). See README.md, This fork."
